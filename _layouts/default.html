<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} — {% endif %}{{ site.title | escape }}</title>

  <style>
    :root {
      --purple: #4c3cd3;
      --blue: #6355eb;
      --lime: #ccff00;
      --coral: #f85c5c;
      --gray: #9c9c9c;
      --black: #000;
      --white: #fff;
      --font: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--black);
      background: var(--white);
      font-family: var(--font);
    }

    a {
      color: inherit;
    }

    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 18px 5vw;
      border-bottom: 2px solid var(--black);
      background: var(--white);
    }

    .wordmark {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: -0.08em;
      text-decoration: none;
    }

    .main-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px 18px;
    }

    .main-nav a {
      font-size: 0.78rem;
      font-weight: 900;
      text-decoration: none;
      text-transform: uppercase;
    }

    .main-nav a:hover,
    .main-nav a:focus-visible {
      text-decoration: underline;
      text-decoration-thickness: 3px;
      text-underline-offset: 4px;
    }

    main {
      min-height: 75vh;
    }

    .home main {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--purple);
      color: var(--white);
    }

    .home-hero {
      width: 100%;
      padding: 10vh 8vw;
      text-align: center;
    }

    .home-hero h1 {
      margin: 0;
      font-size: clamp(5rem, 23vw, 20rem);
      line-height: 0.78;
      letter-spacing: -0.11em;
      font-weight: 900;
    }

    .home-hero p {
      max-width: 700px;
      margin: 36px auto 0;
      font-size: clamp(1.1rem, 2.5vw, 1.7rem);
      font-weight: 700;
      line-height: 1.4;
    }

    .page-section {
      min-height: 75vh;
      padding: clamp(48px, 9vw, 120px) 8vw;
    }

    .section-idee {
      background: var(--lime);
    }

    .section-scienza {
      background: var(--blue);
    }

    .section-cultura {
      background: var(--coral);
    }

    .section-about {
      background: var(--gray);
    }

    .section-collabora {
      background: var(--black);
      color: var(--white);
    }

    .eyebrow {
      margin: 0 0 18px;
      font-size: 0.8rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .section-title {
      margin: 0 0 28px;
      font-size: clamp(3rem, 9vw, 8rem);
      line-height: 0.88;
      letter-spacing: -0.09em;
      font-weight: 900;
      text-transform: uppercase;
    }

    .section-scienza .section-title {
      text-decoration: underline;
      text-decoration-thickness: 8px;
      text-underline-offset: 12px;
      text-decoration-skip-ink: none;
    }

    .section-intro {
      max-width: 760px;
      margin-bottom: 54px;
      font-size: clamp(1.1rem, 2vw, 1.45rem);
      font-weight: 700;
      line-height: 1.5;
    }

    .article-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr));
      gap: 18px;
    }

    .article-card {
      display: block;
      min-height: 210px;
      padding: 24px;
      border: 2px solid var(--black);
      background: var(--white);
      color: var(--black);
      text-decoration: none;
      transition: transform 120ms ease;
    }

    .article-card:hover,
    .article-card:focus-visible {
      transform: translate(-4px, -4px);
      box-shadow: 6px 6px 0 var(--black);
    }

    .article-card time {
      display: block;
      margin-bottom: 18px;
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .article-card h2 {
      margin: 0 0 12px;
      font-size: clamp(1.5rem, 3vw, 2.2rem);
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .article-card p {
      margin: 0;
      line-height: 1.45;
    }

    .no-articles {
      font-weight: 800;
    }

    .about-copy,
    .collabora-copy {
      max-width: 800px;
      font-size: clamp(1.1rem, 2vw, 1.45rem);
      line-height: 1.55;
    }

    .collabora-copy {
      font-weight: 700;
    }

    .contact-link {
      display: inline-block;
      margin-top: 16px;
      padding-bottom: 5px;
      border-bottom: 3px solid var(--white);
      font-size: 1.2rem;
      font-weight: 900;
      text-decoration: none;
    }

    .site-footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 8vw;
      background: var(--black);
      color: var(--white);
      font-size: 0.85rem;
    }

    @media (max-width: 700px) {
      .site-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .main-nav {
        justify-content: flex-start;
      }

      .main-nav a {
        font-size: 0.7rem;
      }

      .site-footer {
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .article-card {
        transition: none;
      }
    }
  </style>
</head>

<body class="{{ page.theme | default: 'home' }}">
  <header class="site-header">
    <a class="wordmark" href="{{ '/' | relative_url }}">CURIOSA</a>

    <nav class="main-nav" aria-label="Navigazione principale">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/idee-societa.html' | relative_url }}">Idee &amp; Società</a>
      <a href="{{ '/scienza-tech.html' | relative_url }}">Scienza &amp; Tech</a>
      <a href="{{ '/cultura.html' | relative_url }}">Cultura</a>
      <a href="{{ '/chi-siamo.html' | relative_url }}">Chi siamo</a>
      <a href="{{ '/collabora.html' | relative_url }}">Collabora</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>© {{ site.time | date: "%Y" }} CURIOSA</span>
    <a href="{{ '/' | relative_url }}">Torna alla Home ↑</a>
  </footer>
</body>
</html>
