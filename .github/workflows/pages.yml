name: GitHub Pages CI
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A96002: ${{ secrets.A96002 }}
          B1593F: ${{ secrets.B1593F }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A96002', '')
          tag_b = os.environ.get('B1593F', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- 5691e1170bf167b9a29d048e4c28f394d6a2c977f1ee2b -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- 5f6a9b2c0794a43bda1c96fb -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
